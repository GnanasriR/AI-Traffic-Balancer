server.port=8085
spring.application.name=analytics-service

# Database Persistence Configuration (Oracle in Production, H2 in Dev/Test)
spring.datasource.url=${DB_URL:jdbc:h2:mem:analyticsdb;DB_CLOSE_DELAY=-1;MODE=Oracle}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Settings
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Eureka Discovery Client
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
