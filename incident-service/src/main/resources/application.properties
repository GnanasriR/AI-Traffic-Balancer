server.port=8084
spring.application.name=incident-service

# Eureka Discovery Client
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Incident & Emergency Configuration
incident.emergency.max-duration=300.0
incident.default-capacity-impact=0.50

# Simulation Bridge Configuration
python.simulator.base-url=${PYTHON_SIMULATOR_URL:http://localhost:8000}
