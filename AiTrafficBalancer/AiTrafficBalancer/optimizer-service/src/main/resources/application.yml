server:
  port: 8082

spring:
  application:
    name: optimizer-service

eureka:
  client:
    username: ${EUREKA_USER:eureka}
    password: ${EUREKA_PASSWORD:eureka123}
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

traffic:
  simulation:
    interval-ms: 200 # 5 Hz update rate
    min-green-s: 10
    max-green-s: 60
    yellow-time-s: 3
    all-red-clearance-s: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.kce.traffic: DEBUG