spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:userdb-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: dGVzdC1vbmx5LXNlY3JldC1rZXktMzJ6LWJ5dGVzLW1pbmltdW0tc2VjdXJl
    expiration-ms: 86400000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
